[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c4f"
version = "0.1.0"
description = "Cluster ML model outputs and analyze prediction error disparities across demographic groups"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "hdbscan",
    "kmodes",
]

[project.optional-dependencies]
# Experiment mode's omnibus error test uses R's fisher.test via rpy2 (needs R >= 4.5).
experiment = ["rpy2"]
web = ["gradio", "rpy2"]
# scikit-learn-extra (KMedoids) has no numpy-2 wheels; only needed for --algorithm kmedoids.
kmedoids = ["scikit-learn-extra"]

[project.scripts]
c4f = "c4f.main:main"
c4f-web = "c4f.webapp:launch"

[tool.setuptools.packages.find]
where = ["."]
include = ["c4f*"]